<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - Indoor Positioning System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-auth-page="protected">
    <div class="header">
        <div class="header-content">
            <div>
                <h1 class="header-title" data-i18n="home.title">Homepage</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    <span data-i18n="home.welcome">Welcome</span>: <strong id="welcome-user"></strong>
                </p>
            </div>
            <div class="header-controls">
                <button id="settings-btn" class="btn btn-secondary">Settings</button>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2 data-i18n="settings">Settings</h2>
            <button id="close-settings" class="btn btn-secondary btn-small" data-i18n="close">Close</button>
        </div>
        <div class="settings-section">
            <h3 data-i18n="theme">Theme</h3>
            <div id="theme-toggle" class="toggle-switch"></div>
        </div>
        <div class="settings-section">
            <h3 data-i18n="language">Language</h3>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="language" value="en" checked><span>English</span></label>
                <label class="radio-option"><input type="radio" name="language" value="vi"><span>Tieng Viet</span></label>
            </div>
        </div>
        <div class="settings-section">
            <h3 data-i18n="quickNav">Quick Navigation</h3>
            <div id="settings-quick-nav" class="quick-links"></div>
            <button id="logout-btn" class="btn btn-danger btn-small hidden" data-i18n="logout" style="margin-top: 10px; width: 100%;">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="home-actions" class="home-grid"></div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
