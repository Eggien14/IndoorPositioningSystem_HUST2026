<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Training - Indoor Positioning System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-auth-page="protected">
    <div class="header">
        <div class="header-content">
            <div><h1 class="header-title" data-i18n="trainingSelect.title">Select Training</h1></div>
            <div class="header-controls"><a href="/home" class="btn btn-secondary" data-i18n="back">Back</a><button id="settings-btn" class="btn btn-secondary">Settings</button></div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-header"><h2 data-i18n="settings">Settings</h2><button id="close-settings" class="btn btn-secondary btn-small" data-i18n="close">Close</button></div>
        <div class="settings-section"><h3 data-i18n="theme">Theme</h3><div id="theme-toggle" class="toggle-switch"></div></div>
        <div class="settings-section"><h3 data-i18n="language">Language</h3><div class="radio-group"><label class="radio-option"><input type="radio" name="language" value="en" checked><span>English</span></label><label class="radio-option"><input type="radio" name="language" value="vi"><span>Tieng Viet</span></label></div></div>
        <div class="settings-section"><h3 data-i18n="quickNav">Quick Navigation</h3><div id="settings-quick-nav" class="quick-links"></div><button id="logout-btn" class="btn btn-danger btn-small hidden" data-i18n="logout" style="margin-top: 10px; width: 100%;">Logout</button></div>
    </div>

    <div class="container">
        <div class="card" style="max-width: 760px; margin: 0 auto;">
            <div class="form-group"><label class="form-label" data-i18n="trainingSelect.map">Map</label><select id="train-map" class="form-select"></select></div>
            <div class="form-group"><label class="form-label" data-i18n="trainingSelect.devices">Devices</label><div id="train-devices" class="grid grid-3"></div></div>
            <div class="form-group"><label class="form-label" data-i18n="trainingSelect.algorithm">Algorithm</label><select id="train-algorithm" class="form-select"></select></div>
            <div class="form-group"><label class="form-label" data-i18n="trainingSelect.session">Session</label><select id="train-session" class="form-select"><option value="">Creative Mode</option></select></div>
            <button id="start-training-btn" class="btn btn-primary" style="width: 100%;" data-i18n="start">Start</button>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/training_select.js"></script>
</body>
</html>
