<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Map - Indoor Positioning System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-auth-page="protected">
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div>
                <h1 class="header-title" data-i18n="app.title">Indoor Positioning System</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;" data-i18n="app.subtitle">Map Management & Data Collection</p>
            </div>
            <div class="header-controls">
                <button id="settings-btn" class="btn btn-secondary btn-icon" title="Settings">⚙</button>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2 data-i18n="settings">Settings</h2>
            <button id="close-settings" class="btn btn-secondary btn-small" data-i18n="close">Close</button>
        </div>
        
        <div class="settings-section">
            <h3 data-i18n="theme">Theme</h3>
            <div id="theme-toggle" class="toggle-switch"></div>
        </div>
        
        <div class="settings-section">
            <h3 data-i18n="language">Language</h3>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="language" value="en" checked>
                    <span>English</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="language" value="vi">
                    <span>Tiếng Việt</span>
                </label>
            </div>
        </div>

        <div class="settings-section">
            <h3 data-i18n="quickNav">Quick Navigation</h3>
            <div id="settings-quick-nav" class="quick-links"></div>
            <button id="logout-btn" class="btn btn-danger btn-small hidden" data-i18n="logout" style="margin-top: 10px; width: 100%;">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 data-i18n="maps.title">Select Map</h2>
            <a href="/create-map" class="btn btn-primary" data-i18n="maps.createNew">Create New Map</a>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="spinner"></div>

        <!-- Maps Grid -->
        <div id="maps-container" class="grid grid-2 hidden"></div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center hidden" style="padding: 60px 20px;">
            <p style="color: var(--text-secondary); font-size: 1.1rem;" data-i18n="maps.noMaps">
                No maps available. Create your first map!
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/common.js"></script>
    <script src="/static/js/choose_map.js"></script>
</body>
</html>
