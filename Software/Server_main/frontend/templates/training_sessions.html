<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exercise - Indoor Positioning System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-auth-page="protected">
    <div class="header">
        <div class="header-content">
            <div>
                <h1 class="header-title" data-i18n="session.title">Create Exercise</h1>
            </div>
            <div class="header-controls">
                <a href="/home" class="btn btn-secondary" data-i18n="back">Back</a>
                <button id="settings-btn" class="btn btn-secondary">Settings</button>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="settings-panel">
        <div class="settings-header"><h2 data-i18n="settings">Settings</h2><button id="close-settings" class="btn btn-secondary btn-small" data-i18n="close">Close</button></div>
        <div class="settings-section"><h3 data-i18n="theme">Theme</h3><div id="theme-toggle" class="toggle-switch"></div></div>
        <div class="settings-section"><h3 data-i18n="language">Language</h3><div class="radio-group"><label class="radio-option"><input type="radio" name="language" value="en" checked><span>English</span></label><label class="radio-option"><input type="radio" name="language" value="vi"><span>Tieng Viet</span></label></div></div>
        <div class="settings-section"><h3 data-i18n="quickNav">Quick Navigation</h3><div id="settings-quick-nav" class="quick-links"></div><button id="logout-btn" class="btn btn-danger btn-small hidden" data-i18n="logout" style="margin-top: 10px; width: 100%;">Logout</button></div>
    </div>

    <div class="container">
        <div class="card mb-20" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 data-i18n="session.title">Create Exercise</h2>
            <button id="create-session-btn" class="btn btn-primary" data-i18n="session.new">Create New Exercise</button>
        </div>

        <div id="session-list" class="grid grid-2"></div>
    </div>

    <div id="session-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title" data-i18n="session.new">Create New Exercise</h3></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label" data-i18n="session.map">Map</label><select id="session-map-id" class="form-select"></select></div>
                <div class="form-group"><label class="form-label" data-i18n="session.name">Exercise Name</label><input id="session-name" class="form-input"></div>
                <div class="form-group"><label class="form-label" data-i18n="session.duration">Duration (seconds)</label><input id="session-duration" type="number" class="form-input" min="1" value="120"></div>
            </div>
            <div class="modal-footer">
                <button id="session-modal-cancel" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
                <button id="session-modal-save" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/training_sessions.js"></script>
</body>
</html>
